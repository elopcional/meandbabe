<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me+Babe</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My Custom CSS -->
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="try.css">
</head>
<body>



<!-- FIREBASE LOGIN -->
<section class="firebase-account">

    <h2>Our Private Memory Space ❤️</h2>

    <p id="authMessage">Sign in to access our shared memories.</p>

    <form id="loginForm">
        <input
            type="email"
            id="emailInput"
            placeholder="Email address"
            autocomplete="username"
            required
        >

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign In</button>

        <button type="button" id="createAccount">
            Create Account
        </button>
    </form>

    <button type="button" id="signOut" hidden>
        Sign Out
    </button>

</section>



<!-- UPLOAD AREA -->
<div class="gallery-actions">

    <label for="imageUpload" class="upload-button">
        + Add a Memory
    </label>

    <input
        type="file"
        id="imageUpload"
        accept="image/*,video/*"
        multiple
        hidden
    >

    <select id="memoryCategory" aria-label="Memory category">
        <option value="dates">Our Dates</option>
        <option value="adventures">Adventures</option>
        <option value="special">Special Occasions</option>
        <option value="everyday">Everyday Moments</option>
        <option value="videos">Videos</option>
    </select>

    <p id="uploadStatus" aria-live="polite"></p>

    <progress id="uploadProgress" value="0" max="100" hidden></progress>

</div>


<!-- FIREBASE GALLERY -->
<section class="gallery-grid" id="galleryGrid">

    <!-- Firebase memories will appear here automatically -->

</section>

<p id="emptyMessage" class="empty-message" hidden>
    No memories in this category yet. Add a new memory!
</p>


<script src="gallery.js"></script>
<script src="first.JS"></script>
<script src="translations1.js"></script>
<script src="translationss.js"></script>
<script type="module" src="firebase-gallery.js"></script>


<script src="translations1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="firebase-gallery.js"></script>
<script src="firebase-gallery.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Me+Babe</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My Custom CSS -->
    <link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="try1.css">
<link rel="stylesheet" href="try.css">
    <link rel="stylesheet" href="second.css">

     <link rel="stylesheet" href="third.css">

    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.ico">
</head>

  <!-- ================================== -->
    <!-- ORIGINAL GALLERY IMAGES -->
    <!-- ================================== -->

    <section class="gallery-grid" id="galleryGrid">


        <!-- OUR DATES -->

        <article class="gallery-item" data-category="dates">

            <img src="./pictures/image2.jpg"
                 alt="Our special date">

            <div class="image-caption">

                <h3 data-translate="ourSpecialDate">
                    Our Special Date
                </h3>

                <p data-translate="beautifulDay">
                    A beautiful day together ❤️
                </p>

            </div>

        </article>


        <article class="gallery-item" data-category="dates">

            <img src="./pictures/image7.JPEG"
                 alt="A moment together">

            <div class="image-caption">

                <h3 data-translate="timeTogether">
                    Time Together
                </h3>

                <p data-translate="littleMomentsBigMemories">
                    Little moments, big memories.
                </p>

            </div>

        </article>


        <!-- ADVENTURES -->

        <article class="gallery-item" data-category="adventures">

            <img src="./pictures/visiting the world.jpg"
                 alt="Our adventure">

            <div class="image-caption">

                <h3 data-translate="ourAdventure">
                    Our Adventure
                </h3>

                <p data-translate="exploringWorld">
                    Exploring the world together 🌍
                </p>

            </div>

        </article>


        <!-- SPECIAL OCCASIONS -->

        <article class="gallery-item" data-category="special">

            <img src="./pictures/image9.jpg"
                 alt="Special celebration">

            <div class="image-caption">

                <h3 data-translate="specialCelebration">
                    A Special Celebration
                </h3>

                <p data-translate="dayWorthRemembering">
                    A day worth remembering.
                </p>

            </div>

        </article>


        <!-- EVERYDAY MOMENTS -->

        <article class="gallery-item" data-category="everyday">

            <img src="./pictures/image8.JPG"
                 alt="Everyday memory">

            <div class="image-caption">

                <h3 data-translate="simpleHappiness">
                    Simple Happiness
                </h3>

                <p data-translate="littleThingsSmile">
                    The little things that make us smile.
                </p>

            </div>

        </article>

    </section>


    <!-- EMPTY GALLERY MESSAGE -->

    <p id="emptyMessage"
       class="empty-message"
       hidden
       data-translate="emptyGallery">

        No memories in this category yet. Add a new memory!

    </p>

</main>


   
    <!-- ================================== -->
    <!-- IMAGE LIGHTBOX -->
    <!-- ================================== -->

    <div class="lightbox" id="lightbox">

        <button class="close-lightbox" id="closeLightbox"
                aria-label="Close">
            &times;
        </button>

        <button class="lightbox-arrow previous" id="previousImage"
                aria-label="Previous image">
            &#10094;
        </button>

        <div class="lightbox-content" id="lightboxContent"></div>

        <button class="lightbox-arrow next" id="nextImage"
                aria-label="Next image">
            &#10095;
        </button>

        <p id="lightboxCaption"></p>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

   <!-- some JavaScript-->
     <script src="first.JS"></script>

    <!-- Shared Translation JavaScript -->
<script src="translations1.js"></script>
<script src="javascriptLanguage.js"></script>
<script src="welcomePopup.js"></script>
<script src="zoomingImages.js"></script>

</body>
</html>
